version: '3'

includes:
  download: ./Taskfile.download.yml
  process: ./Taskfile.process.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: "Build the seed DB from all sources into ../assets/calora_seed.db"
    cmds:
      - uv run python build.py

  all:
    desc: "Full pipeline: download all sources, process, build DB"
    deps:
      - download:ausnut
      - download:nzfc
      - download:off
      - download:usda
    cmds:
      - task: process:filter
      - task: build
