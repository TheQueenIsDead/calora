version: '3'

# Run from the data/ directory: task <name>
# Requires: uv (https://docs.astral.sh/uv/), curl, gzip

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ── Fetch NZ OFF data (choose one approach) ──────────────────────────────

  fetch-off-nz:
    desc: "Fetch NZ products from Open Food Facts API (~14k products, slower)"
    cmds:
      - uv run python open-food-facts-nz/fetch_nz_products.py

  download-off-dump:
    desc: "Download the full Open Food Facts CSV dump (~9 GB compressed)"
    env:
      URL: https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
    cmds:
      - curl -L --continue-at - -o open-food-facts-nz/en.openfoodfacts.org.products.csv.gz "$URL"

  filter-off-nz:
    desc: "Extract NZ and AU products from the full OFF dump (run after download-off-dump)"
    cmds:
      - uv run python open-food-facts-nz/filter_nz.py

  # ── Source data downloads ─────────────────────────────────────────────────

  ausnut:
    desc: "Download and extract AUSNUT 2023 Excel files (~11 MB)"
    env:
      URL: https://www.foodstandards.gov.au/sites/default/files/2026-03/AUSNUT%202023%20-%20All%20Files_0.zip
    cmds:
      - mkdir -p ausnut
      - curl -L -o ausnut/AUSNUT2023.zip "$URL"
      - unzip -j -o ausnut/AUSNUT2023.zip -d ausnut
      - rm ausnut/AUSNUT2023.zip

  nzfc:
    desc: "Download NZ Food Composition 14th edition Excel file"
    env:
      URL: https://www.foodcomposition.co.nz/downloads/concise-14-edition.xlsx
    cmds:
      - mkdir -p nzfc
      - curl -L -o nzfc/concise-14-edition.xlsx "$URL"

  usda:
    desc: "Download and extract USDA Foundation Foods CSV files (~32 MB unzipped)"
    env:
      URL: https://www.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip
    cmds:
      - mkdir -p usda/foundation
      - curl -L -o usda/foundation_food.zip "$URL"
      - unzip -j -o usda/foundation_food.zip -d usda/foundation
      - rm usda/foundation_food.zip

  # ── Build ─────────────────────────────────────────────────────────────────

  build:
    desc: "Build the seed DB from all sources into ../assets/calora_seed.db"
    cmds:
      - uv run python build_db.py

  # ── Full pipelines ────────────────────────────────────────────────────────

  all:
    desc: "Full pipeline using OFF API (fetch NZ products → build DB)"
    cmds:
      - task: fetch-off-nz
      - task: build

  all-from-dump:
    desc: "Full pipeline using OFF full dump (download → filter → build DB)"
    cmds:
      - task: download-off-dump
      - task: filter-off-nz
      - task: build
