version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ── Downloads ─────────────────────────────────────────────────────────────

  ausnut:
    desc: "Download and extract AUSNUT 2023 Excel files (~11 MB)"
    vars:
      URL: https://www.foodstandards.gov.au/sites/default/files/2026-03/AUSNUT%202023%20-%20All%20Files_0.zip
    status:
      - test -f ausnut/AUSNUT2023.zip
    cmds:
      - curl -L -o ausnut/AUSNUT2023.zip "{{.URL}}"
      - unzip -j -o ausnut/AUSNUT2023.zip -d ausnut

  nzfc:
    desc: "Download NZ Food Composition 14th edition Excel file"
    vars:
      URL: https://www.foodcomposition.co.nz/downloads/concise-14-edition.xlsx
    status:
      - test -f nzfc/concise-14-edition.xlsx
    cmds:
      - mkdir -p nzfc
      - curl -L -o nzfc/concise-14-edition.xlsx "{{.URL}}"

  off:
    desc: "Download full Open Food Facts dump (~9 GB compressed)"
    vars:
      URL: https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
    status:
      - test -f off/en.openfoodfacts.org.products.csv.gz
    cmds:
      - mkdir -p off
      - curl -L --continue-at - -o off/en.openfoodfacts.org.products.csv.gz "{{.URL}}"

  usda:
    desc: "Download and extract USDA Foundation Foods CSV files (~32 MB unzipped)"
    vars:
      URL: https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_csv_2026-04-30.zip
    status:
      - test -f usda/foundation_food.zip
    cmds:
      - mkdir -p usda
      - curl -L -o usda/foundation_food.zip "{{.URL}}"
      - unzip -j -o usda/foundation_food.zip -d usda

  # ── Process ───────────────────────────────────────────────────────────────

  filter:
    desc: "Filter OFF dump to APAC CSV using DuckDB, then delete dump"
    status:
      - test -f off/apac.en.openfoodfacts.org.products.csv
    cmds:
      - uv run python filter.py
      - rm off/en.openfoodfacts.org.products.csv.gz

  # ── Build ─────────────────────────────────────────────────────────────────

  build:
    desc: "Build the seed DB from all sources into ../assets/calora_seed.db"
    cmds:
      - uv run python build.py

  # ── Pipeline ──────────────────────────────────────────────────────────────

  all:
    desc: "Full pipeline: download all sources, process, build DB"
    deps: [ausnut, nzfc, off, usda]
    cmds:
      - task: filter
      - task: build
