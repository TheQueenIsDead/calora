name: Dependabot auto-merge

# Runs after CI completes so we only merge when tests are green.
# workflow_run always executes in the context of the default branch,
# giving GITHUB_TOKEN write access even for Dependabot PRs (which
# restrict token permissions when triggered via pull_request).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Find PR for this commit
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls" \
            --jq "[.[] | select(.head.sha == \"${{ github.event.workflow_run.head_sha }}\")][0].number")
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Approve and merge
        if: steps.pr.outputs.number != '' && steps.pr.outputs.number != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ steps.pr.outputs.number }} --approve \
            --repo ${{ github.repository }}
          gh pr merge ${{ steps.pr.outputs.number }} --squash --delete-branch \
            --repo ${{ github.repository }}
